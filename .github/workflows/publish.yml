name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'fischerscode/legal.dart'
    uses: ./.github/workflows/verify.yml
    with:
      release-tag: ${{ github.ref_name }}
  publish:
    needs: verify
    # Enable only after the first manual publication and pub.dev OIDC setup.
    if: github.repository == 'fischerscode/legal.dart' && vars.PUB_DEV_AUTOMATED_PUBLISHING == 'true'
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@92cfcc5b56b5f03d4418281fd5b0ae0dacbfd9fa
    with:
      environment: pub.dev
