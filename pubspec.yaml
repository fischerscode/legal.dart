name: legal
description: Offline third-party license inventory, SPDX policy checks, and deterministic license notices for Dart applications.
version: 0.2.0
repository: https://github.com/fischerscode/legal.dart
issue_tracker: https://github.com/fischerscode/legal.dart/issues
topics:
  - licenses
  - cli
  - compliance
  - spdx
environment:
  sdk: ^3.13.0
dependencies:
  args: ^2.7.0
  # Internal license detection API: review adapter/tests before changing this pin.
  pana: '>=0.23.18 <0.23.20'
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3
dev_dependencies:
  lints: ^6.1.0
  melos: ^8.9.0
  test: ^1.31.1
executables:
  legal:
workspace: []
melos:
  sdkPath: .fvm/flutter_sdk
  useRootAsPackage: true
  ide:
    intellij:
      enabled: false
  command:
    version:
      branch: main
      workspaceChangelog: false
      updateChangelog: true
      releaseUrl: true
      gitTagVersion: true
      gitCommitVersion: true
      fetchTags: false
      message: 'chore(release): publish legal'
  scripts:
    analyze: dart analyze --fatal-infos
    test: dart test
    format: dart format .
    check: dart run tool/check.dart
legal:
  policy: permissive
  unknown: deny
  packages:
    overrides:
      html:
        versions: '0.15.7'
        expression: MIT
        reason: 'Reviewed full LICENSE: standard MIT terms preceded by copyright and a contributor attribution list, which exceeds pana unmatched-text limits. Preserve all original attribution.'
