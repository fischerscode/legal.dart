name: Verify package
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - name: Validate release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: dart run tool/validate_release.dart "$RELEASE_TAG"
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Dogfood and verify deterministic notices
        run: |
          dart run legal list
          dart run legal check
          dart run legal generate
          cp THIRD_PARTY_LICENSES.txt /tmp/legal-notices-first.txt
          dart run legal generate
          cmp THIRD_PARTY_LICENSES.txt /tmp/legal-notices-first.txt
      - run: dart doc
      - run: dart pub publish --dry-run
